<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Sports Coaching Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🏋️‍♂️ AI 스포츠 코칭 랩</h1>
        <div id="auth-section">
            <button id="btn-login">구글 로그인</button>
            <button id="btn-logout" class="hidden">로그아웃</button>
        </div>
    </header>

    <main>
        <section id="guest-view">
            <p>나만의 AI 트레이너를 만나보세요. 서비스를 이용하려면 로그인이 필요합니다.</p>
        </section>

        <section id="user-view" class="hidden">
            <div class="welcome-msg">
                <span id="user-name"></span> 코치님, 환영합니다!
            </div>

            <div class="coach-container">
                <h3>오늘의 운동 컨디션 / 목표 입력</h3>
                <textarea id="user-input" placeholder="예: 오늘 하체 운동 날인데 무릎이 조금 뻐근해. 무리 안 가는 루틴과 동기부여 한마디 해줘!"></textarea>
                <button id="btn-ask">AI 코치에게 진단받기</button>
            </div>

            <div id="result-container" class="hidden">
                <h3>📋 AI 코치의 처방</h3>
                <p id="ai-response"></p>
                <button id="btn-speak">📢 음성으로 듣기 (TTS)</button>
            </div>

            <div class="history-container">
                <h3>📅 나의 코칭 기록 히스토리</h3>
                <ul id="history-list"></ul>
            </div>
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
